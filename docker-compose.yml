services:
  mcserver:
    build: ./server
    hostname: mcserver
    stop_grace_period: 60s
    volumes:
      - ./server:/server
    ports:
      - "25564:25564"
    stdin_open: true
    tty: true
    restart: unless-stopped

  server:
    build: ./slaycraft/dashboard/server
    environment:
      PORT: 3001
      MCFARMMANAGER_URL: ${MCFARMMANAGER_URL:-http://mcserver:8642}
      MCFARMMANAGER_API_TOKEN: ${MCFARMMANAGER_API_TOKEN:-}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      DASHBOARD_DATA_DIR: /data
    volumes:
      - dashboard-data:/data
    depends_on:
      - mcserver
    restart: unless-stopped

  client:
    build: ./slaycraft/dashboard/client
    depends_on:
      - server
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client
    restart: unless-stopped

volumes:
  dashboard-data:
    name: dashboard_dashboard-data
  caddy-data:
    name: dashboard_caddy-data
  caddy-config:
    name: dashboard_caddy-config
