services:
  server:
    build: ./server
    environment:
      PORT: 3001
      MCFARMMANAGER_URL: ${MCFARMMANAGER_URL:-http://host.docker.internal:8642}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      DASHBOARD_DATA_DIR: /data
    volumes:
      - dashboard-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  dashboard-data:
